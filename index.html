<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Tracker</title>
  <meta name="description" content="Personal daily tracker for gym, study, to-do, sleep, and prayer times." />
  <meta name="theme-color" content="#000000" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="page-dots" class="page-dots" aria-label="Sections"></nav>
  <div id="pager">
    <section class="page" data-page="home"></section>
    <section class="page" data-page="gym"></section>
    <section class="page" data-page="study"></section>
    <section class="page" data-page="todo"></section>
